name: Windows validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      package_windows:
        description: Build an unsigned Windows development installer artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Build, tests, and PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build and check native color helper without changing display settings
        run: |
          npm run prepare:color
          if ($LASTEXITCODE -ne 0) { throw 'Color helper compilation failed.' }
          node tests/windows.colors.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Color helper validation failed.' }

      - name: Prepare verified FPS collector
        run: npm run prepare:collector

      - name: Verify real Windows graphics event capture
        run: node tests/windows.capture.cjs

      - name: Run automated tests
        run: npm test

      - name: Verify live Windows inventory and tweak detection
        run: node tests/windows.read.cjs

      - name: Verify native backup and restore on the isolated runner
        shell: powershell
        run: |
          try { ./tests/windows.integration.ps1 }
          catch {
            $detail = ($_.ToString() + ' ' + $_.InvocationInfo.PositionMessage) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Windows backup and restore failed::$detail"
            throw
          }

      - name: Verify protected-registry handling on disposable test keys
        shell: powershell
        run: |
          try { ./tests/windows.permissions.ps1 }
          catch {
            $detail = ($_.ToString() + ' ' + $_.InvocationInfo.PositionMessage) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Registry permission regression failed::$detail"
            throw
          }

      - name: Parse native scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'This check requires Windows PowerShell 5.1.'
          }
          $failed = $false
          foreach ($script in Get-ChildItem -LiteralPath 'scripts/windows' -Filter '*.ps1' -File) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Output "$($script.Name):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
            } else {
              Write-Output "Parsed $($script.Name)"
            }
          }
          if ($failed) { throw 'Native scripts contain PowerShell parse errors.' }

      - name: Build unsigned Windows tester installer
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_windows)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never

      - name: Verify packaged application and generate checksum
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_windows)
        run: npm run verify:package

      - name: Test installer, desktop launch, shortcuts, and uninstall
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_windows)
        shell: powershell
        run: |
          try { ./tests/windows.installer.ps1 }
          catch {
            $detail = ($_.ToString() + ' ' + $_.InvocationInfo.PositionMessage) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Windows installer validation failed::$detail"
            throw
          }

      - name: Retain installer for development review
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package_windows)
        uses: actions/upload-artifact@v4
        with:
          name: tweakerzzz-windows-development
          path: |
            release/Tweakerzzz-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/latest.yml
            release/*.blockmap
            release/qa/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows tester download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tweakerzzz-windows-development
          path: release
      - name: Publish verified installer as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          gh release create "$RELEASE_TAG" release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt --verify-tag --prerelease --title "Tweakerzzz $RELEASE_TAG - Windows tester installer" --notes-file docs/TESTER_RELEASE.md
